# Blank issues stay enabled on purpose: a question that none of these three
# documents answers is still worth asking, and a form should not be a gate in
# front of it. The two forms exist for the two reports the README asks for by
# name, because both of them are answered by a file the reporter can generate
# in one command and nobody thinks to attach unprompted.
blank_issues_enabled: true

